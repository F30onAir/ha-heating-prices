[project]
name = "ha-heating-prices"
version = "0.1.1"
description = "Home Assistant integration for heating oil, wood pellet and natural gas prices from open data."
requires-python = ">=3.13"
license = "MIT"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PL", "RUF", "SIM", "UP", "W"]
ignore = [
  "E501",    # long lines are left to the formatter
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR2004",
  "RUF001",  # German text uses typographic characters on purpose
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "heating_prices"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
